# Builds the site and publishes it to GitHub Pages on every push to main, following
# https://docs.astro.build/en/guides/deploy/github/. In the repository's Settings → Pages, set Source to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a deploy to be started by hand from the Actions tab.
  workflow_dispatch:

# Read the repository, and publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push doesn't cancel one already under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      # Installs with npm (from package-lock.json), runs `npm run build` and uploads dist/. Node 24 by default.
      - name: Install, build and upload the site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
